<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Inter,system-ui,sans-serif;color:#f5f5f7}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 15% 5%,#7b8cff3d,transparent 35%),radial-gradient(circle at 90% 90%,#7b8cff24,transparent 35%),linear-gradient(180deg,#252631,#15161d);padding:28px}
.orb{position:fixed;border-radius:50%;filter:blur(55px);pointer-events:none;opacity:.35}
.o1{width:300px;height:300px;top:-100px;right:8%;background:#7b8cff}
.o2{width:240px;height:240px;bottom:-80px;left:8%;background:#b56cff}
.glass{background:#ffffff0d;border:1px solid #ffffff1a;backdrop-filter:blur(35px) saturate(1.3);-webkit-backdrop-filter:blur(35px) saturate(1.3);box-shadow:0 25px 70px #0007,inset 0 1px #ffffff14}
.shell{position:relative;z-index:1;width:min(980px,100%);margin:auto}
.brand{font-size:13px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:#bfc6ff;margin:0 0 14px 5px}
.card{border-radius:28px;padding:34px}
.login{width:min(440px,100%);margin:10vh auto}
.h{font-size:34px;letter-spacing:-1.4px;margin-bottom:9px}
.sub{color:#aaaab8;font-size:13px;line-height:1.6;margin-bottom:22px}
.input{width:100%;height:52px;border-radius:15px;border:1px solid #ffffff18;background:#ffffff0b;color:#fff;outline:0;padding:0 16px;font-size:15px;margin-bottom:12px}
.input:focus{border-color:#7b8cff88;box-shadow:0 0 0 3px #7b8cff22}
.btn{height:44px;border:0;border-radius:13px;background:#7b8cff;color:#10111a;font-weight:700;padding:0 16px;cursor:pointer;box-shadow:0 9px 28px #7b8cff45;transition:.2s;font-size:13px}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.secondary{background:#ffffff0b;color:#fff;border:1px solid #ffffff16;box-shadow:none}
.btn.danger{background:#ff5c6c22;color:#ff929f;border:1px solid #ff5c6c44;box-shadow:none}
.btn.success{background:#66e39a22;color:#8ef0b8;border:1px solid #66e39a44;box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.error{min-height:18px;color:#ff9aa6;font-size:13px;font-weight:600;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 26px}
.stat{padding:16px;border-radius:16px;background:#ffffff08;border:1px solid #ffffff12}
.stat b{display:block;font-size:24px;margin-bottom:4px}
.stat span{font-size:11px;letter-spacing:1px;color:#aaaab8;font-weight:700}
.section-title{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#bfc6ff;margin:22px 0 10px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:#ffffff08;border:1px solid #ffffff12;flex-wrap:wrap}
.row .meta{min-width:0;flex:1}
.row .name{font-weight:700;font-size:15px;margin-bottom:4px}
.row .detail{color:#aaaab8;font-size:12px;line-height:1.5;word-break:break-word}
.row .btns{display:flex;gap:8px;flex-wrap:wrap}
.token-banner{margin:0 0 18px;padding:14px 16px;border-radius:16px;border:1px solid #66e39a55;background:#66e39a18;color:#b8f5d0;font-size:13px;line-height:1.5;word-break:break-all}
.token-banner code{display:block;margin-top:8px;padding:10px;border-radius:10px;background:#0006;font-family:ui-monospace,monospace;font-size:12px;color:#fff}
.nav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.nav button{height:38px}
.nav button.active{outline:2px solid #7b8cff88}
@media(max-width:640px){.stats{grid-template-columns:1fr}.card{padding:22px}}
</style>
</head>
<body>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="shell" id="app"></div>
<script>
const app = document.getElementById("app");
let view = "requests";
let lastIssuedToken = null;

function fmt(ts) {
  if (!ts) return "—";
  try { return new Date(ts).toLocaleString(); } catch { return ts; }
}
function escapeHtml(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
async function sha256Hex(str) {
  const dig = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(dig)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function login() {
  lastIssuedToken = null;
  app.innerHTML = `
    <section class="card glass login">
      <div class="brand">AKKOAUDIO · ADMIN</div>
      <h1 class="h">Sign in</h1>
      <p class="sub">Review access requests and manage tokens. Password is never sent in plain text.</p>
      <form id="loginForm">
        <input class="input" id="password" type="password" placeholder="Admin password" autocomplete="current-password">
        <button class="btn" style="width:100%;height:50px">Sign in</button>
        <div class="error" id="error"></div>
      </form>
    </section>`;
  document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const err = document.getElementById("error");
    err.textContent = "";
    const password = document.getElementById("password").value;
    const btn = e.target.querySelector("button");
    btn.disabled = true;
    try {
      const chRes = await fetch("/.netlify/functions/admin-login", { method: "GET", cache: "no-store", credentials: "include" });
      const ch = await chRes.json().catch(() => ({}));
      if (!chRes.ok || !ch.nonce || !ch.challengeId) {
        err.textContent = ch.error || "Could not start login.";
        btn.disabled = false;
        return;
      }
      const proof = await sha256Hex(ch.nonce + ":" + password);
      document.getElementById("password").value = "";
      const r = await fetch("/.netlify/functions/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ challengeId: ch.challengeId, proof })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        err.textContent = d.error || "Login failed.";
        btn.disabled = false;
        return;
      }
      dashboard();
    } catch {
      err.textContent = "Network error.";
      btn.disabled = false;
    }
  };
}

async function loadRequests() {
  const r = await fetch("/.netlify/functions/list-requests", { cache: "no-store", credentials: "include" });
  if (r.status === 401) { login(); return null; }
  return r.json();
}
async function loadTokens() {
  const r = await fetch("/.netlify/functions/list-tokens", { cache: "no-store", credentials: "include" });
  if (r.status === 401) { login(); return null; }
  return r.json();
}

function renderRowRequest(row) {
  const pending = row.status === "pending";
  return `<div class="row" data-id="${row.id}">
    <div class="meta">
      <div class="name">${escapeHtml(row.name)} <span style="color:#888;font-weight:500;font-size:12px">· ${row.status}</span></div>
      <div class="detail">
        ${row.contact ? escapeHtml(row.contact) + "<br>" : ""}
        ${row.message ? escapeHtml(row.message) + "<br>" : ""}
        Submitted ${fmt(row.created_at)}
        ${row.reviewed_at ? " · Reviewed " + fmt(row.reviewed_at) : ""}
      </div>
    </div>
    <div class="btns">${pending ? `<button class="btn success" data-act="approve">Approve</button>
      <button class="btn danger" data-act="deny">Deny</button>` : ""}</div>
  </div>`;
}
function renderRowToken(row) {
  return `<div class="row" data-id="${row.id}">
    <div class="meta">
      <div class="name">${escapeHtml(row.label || "Token")} <span style="color:#888;font-weight:500;font-size:12px">· ${row.token_prefix}…</span></div>
      <div class="detail">Created ${fmt(row.created_at)}${row.last_used_at ? " · Last used " + fmt(row.last_used_at) : " · Never used"}${row.revoked ? " · <span style='color:#ff929f'>REVOKED</span>" : ""}</div>
    </div>
    <div class="btns">${!row.revoked ? `<button class="btn danger" data-act="revoke">Revoke</button>` : ""}</div>
  </div>`;
}

async function dashboard() {
  app.innerHTML = `
    <section class="card glass">
      <div class="top">
        <div>
          <div class="brand">AKKOAUDIO · ADMIN</div>
          <h1 class="h">Access control</h1>
          <p class="sub">Approve requests to issue a one-time-visible token. Revoke anytime.</p>
        </div>
        <div class="actions"><button class="btn secondary" id="refresh">Refresh</button></div>
      </div>
      <div class="nav">
        <button class="btn secondary ${view === "requests" ? "active" : ""}" id="tabRequests">Requests</button>
        <button class="btn secondary ${view === "tokens" ? "active" : ""}" id="tabTokens">Tokens</button>
      </div>
      <div id="tokenBanner"></div>
      <div id="content"><p class="sub">Loading…</p></div>
    </section>`;
  document.getElementById("refresh").onclick = () => refresh();
  document.getElementById("tabRequests").onclick = () => { view = "requests"; dashboard(); };
  document.getElementById("tabTokens").onclick = () => { view = "tokens"; dashboard(); };
  if (lastIssuedToken) {
    document.getElementById("tokenBanner").innerHTML = `
      <div class="token-banner">
        <strong>Copy this token now — it will not be shown again.</strong>
        <code>${escapeHtml(lastIssuedToken)}</code>
        <div style="margin-top:10px">
          <button class="btn secondary" id="copyToken">Copy token</button>
          <button class="btn secondary" id="dismissToken">Dismiss</button>
        </div>
      </div>`;
    document.getElementById("copyToken").onclick = async () => { try { await navigator.clipboard.writeText(lastIssuedToken); } catch {} };
    document.getElementById("dismissToken").onclick = () => { lastIssuedToken = null; document.getElementById("tokenBanner").innerHTML = ""; };
  }
  await refresh();
}

async function refresh() {
  const content = document.getElementById("content");
  if (!content) return;
  content.innerHTML = `<p class="sub">Loading…</p>`;
  if (view === "requests") {
    const data = await loadRequests();
    if (!data) return;
    const pending = data.pending || [];
    const approved = data.approved || [];
    const denied = data.denied || [];
    content.innerHTML = `
      <div class="stats">
        <div class="stat"><b>${pending.length}</b><span>PENDING</span></div>
        <div class="stat"><b>${approved.length}</b><span>APPROVED</span></div>
        <div class="stat"><b>${denied.length}</b><span>DENIED</span></div>
      </div>
      <div class="section-title">Pending</div>
      <div class="list">${pending.length ? pending.map(renderRowRequest).join("") : `<div class="detail" style="padding:8px">No pending requests.</div>`}</div>
      <div class="section-title">Approved</div>
      <div class="list">${approved.length ? approved.map(renderRowRequest).join("") : `<div class="detail" style="padding:8px">None yet.</div>`}</div>
      <div class="section-title">Denied</div>
      <div class="list">${denied.length ? denied.map(renderRowRequest).join("") : `<div class="detail" style="padding:8px">None yet.</div>`}</div>`;
    content.querySelectorAll("[data-act]").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.closest(".row").dataset.id;
        const action = btn.dataset.act;
        btn.disabled = true;
        const r = await fetch("/.netlify/functions/review-request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ id, action })
        });
        const d = await r.json().catch(() => ({}));
        if (r.status === 401) { login(); return; }
        if (!r.ok) { alert(d.error || "Failed"); btn.disabled = false; return; }
        if (action === "approve" && d.token) lastIssuedToken = d.token;
        dashboard();
      };
    });
  } else {
    const data = await loadTokens();
    if (!data) return;
    const active = data.active || [];
    const revoked = data.revoked || [];
    content.innerHTML = `
      <div class="stats">
        <div class="stat"><b>${active.length}</b><span>ACTIVE TOKENS</span></div>
        <div class="stat"><b>${revoked.length}</b><span>REVOKED</span></div>
        <div class="stat"><b>${active.length + revoked.length}</b><span>TOTAL</span></div>
      </div>
      <div class="section-title">Active</div>
      <div class="list">${active.length ? active.map(renderRowToken).join("") : `<div class="detail" style="padding:8px">No active tokens.</div>`}</div>
      <div class="section-title">Revoked</div>
      <div class="list">${revoked.length ? revoked.map(renderRowToken).join("") : `<div class="detail" style="padding:8px">None.</div>`}</div>`;
    content.querySelectorAll('[data-act="revoke"]').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm("Revoke this token?")) return;
        const id = btn.closest(".row").dataset.id;
        btn.disabled = true;
        const r = await fetch("/.netlify/functions/revoke-token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ id })
        });
        if (r.status === 401) { login(); return; }
        if (!r.ok) { const d = await r.json().catch(() => ({})); alert(d.error || "Failed"); btn.disabled = false; return; }
        refresh();
      };
    });
  }
}

(async () => {
  const r = await fetch("/.netlify/functions/list-requests", { cache: "no-store", credentials: "include" });
  if (r.status === 401) login();
  else dashboard();
})();
</script>
</body>
</html>
